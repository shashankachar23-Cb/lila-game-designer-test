<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Overclocked Extraction</title>
  <style>
    body {
      margin: 0;
      background: #0d0f12;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      border: 2px solid #30363d;
      background: #161b22;
      box-shadow: 0 0 24px rgba(0,0,0,0.6);
    }
    #hud {
      margin-top: 10px;
      font-size: 14px;
      color: #8b949e;
      display: flex;
      gap: 20px;
    }
  </style>
</head>
<body>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="hud">
    <span>WASD: Move</span>
    <span>Aim: Mouse (Auto-fires in range)</span>
    <span id="objective-text">Survive until Extraction Beacon unlocks</span>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // Game Variables
    let player = { x: 400, y: 300, spd: 3.2, heat: 0, hp: 100, maxHp: 100 };
    let keys = {};
    let mouse = { x: 400, y: 300 };
    let enemies = [];
    let bullets = [];
    let salvage = 0;
    let bankedSalvage = parseInt(localStorage.getItem("banked_scrap") || "0");
    
    // Timer Settings
    let runFrames = 0;
    let lockDurationFrames = 60 * 60; // 60 seconds at 60 FPS
    let extractTimer = 0;
    let extractDuration = 300; // 5 seconds at 60 FPS
    let spawnTimer = 0;
    let sessionState = "PLAYING";

    const pad = { x: 400, y: 300, radius: 70 };

    window.addEventListener("keydown", (e) => (keys[e.key.toLowerCase()] = true));
    window.addEventListener("keyup", (e) => (keys[e.key.toLowerCase()] = false));
    canvas.addEventListener("mousemove", (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
    });

    let fireCooldown = 0;

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      if (sessionState !== "PLAYING") return;
      runFrames++;

      // Player Movement
      if (keys["w"] || keys["arrowup"]) player.y -= player.spd;
      if (keys["s"] || keys["arrowdown"]) player.y += player.spd;
      if (keys["a"] || keys["arrowleft"]) player.x -= player.spd;
      if (keys["d"] || keys["arrowright"]) player.x += player.spd;
      player.x = Math.max(15, Math.min(canvas.width - 15, player.x));
      player.y = Math.max(15, Math.min(canvas.height - 15, player.y));

      // Heat Dissipation (Balanced for longer sessions)
      player.heat = Math.max(0, player.heat - 0.18);

      // Auto-Shooting
      fireCooldown--;
      const heatRatio = player.heat / 100;
      const currentCooldown = Math.max(5, Math.floor(13 - heatRatio * 8));

      if (fireCooldown <= 0) {
        let nearest = null;
        let minDist = 270;
        enemies.forEach(e => {
          let d = Math.hypot(e.x - player.x, e.y - player.y);
          if (d < minDist) { minDist = d; nearest = e; }
        });

        if (nearest) {
          const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
          bullets.push({
            x: player.x,
            y: player.y,
            vx: Math.cos(angle) * 8.5,
            vy: Math.sin(angle) * 8.5,
            rad: 3 + heatRatio * 4,
            dmg: 18 + Math.floor(heatRatio * 32)
          });
          player.heat = Math.min(100, player.heat + 1.6);
          fireCooldown = currentCooldown;
        }
      }

      if (player.heat >= 100) {
        sessionState = "OVERHEAT";
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(i, 1);
          continue;
        }
        for (let j = enemies.length - 1; j >= 0; j--) {
          let en = enemies[j];
          if (Math.hypot(b.x - en.x, b.y - en.y) < b.rad + en.rad) {
            en.hp -= b.dmg;
            bullets.splice(i, 1);
            break;
          }
        }
      }

      // Spawning with dynamic escalation
      spawnTimer++;
      const spawnInterval = Math.max(20, 45 - Math.floor(runFrames / 600)); // spawns faster over time
      if (spawnTimer % spawnInterval === 0) {
        const side = Math.floor(Math.random() * 4);
        let ex = side === 0 ? 0 : side === 1 ? canvas.width : Math.random() * canvas.width;
        let ey = side === 2 ? 0 : side === 3 ? canvas.height : Math.random() * canvas.height;
        const extraHp = Math.floor(runFrames / 900) * 10;
        enemies.push({ x: ex, y: ey, rad: 12, hp: 28 + extraHp, spd: 1.3 + Math.random() * 0.7 });
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        let en = enemies[i];
        const angle = Math.atan2(player.y - en.y, player.x - en.x);
        en.x += Math.cos(angle) * en.spd;
        en.y += Math.sin(angle) * en.spd;

        if (en.hp <= 0) {
          salvage += 10;
          enemies.splice(i, 1);
          continue;
        }
        if (Math.hypot(player.x - en.x, player.y - en.y) < 15 + en.rad) {
          player.hp -= 0.4;
          if (player.hp <= 0) sessionState = "OVERHEAT";
        }
      }

      // Extraction Logic (Pad only unlocks after 60 seconds)
      const isUnlocked = runFrames >= lockDurationFrames;
      const distToPad = Math.hypot(player.x - pad.x, player.y - pad.y);

      if (isUnlocked && distToPad < pad.radius) {
        extractTimer++;
        if (extractTimer >= extractDuration) {
          sessionState = "EXTRACTED";
          bankedSalvage += salvage;
          localStorage.setItem("banked_scrap", bankedSalvage.toString());
        }
      } else {
        extractTimer = Math.max(0, extractTimer - 1);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const isUnlocked = runFrames >= lockDurationFrames;
      const secondsLeftToUnlock = Math.max(0, Math.ceil((lockDurationFrames - runFrames) / 60));

      // Draw Extraction Pad
      ctx.lineWidth = 3;
      if (!isUnlocked) {
        ctx.strokeStyle = "#484f58";
        ctx.setLineDash([6, 6]);
      } else {
        ctx.strokeStyle = extractTimer > 0 ? "#58a6ff" : "#238636";
        ctx.setLineDash([]);
      }

      ctx.beginPath();
      ctx.arc(pad.x, pad.y, pad.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);

      if (!isUnlocked) {
        ctx.fillStyle = "#8b949e";
        ctx.font = "12px monospace";
        ctx.textAlign = "center";
        ctx.fillText(`BEACON LOCK: ${secondsLeftToUnlock}s`, pad.x, pad.y + 4);
      } else if (extractTimer > 0) {
        ctx.fillStyle = "rgba(88, 166, 255, 0.2)";
        ctx.fill();
        ctx.strokeStyle = "#3fb950";
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.arc(pad.x, pad.y, pad.radius, -Math.PI / 2, -Math.PI / 2 + (Math.PI * 2 * (extractTimer / extractDuration)));
        ctx.stroke();
      }

      // Draw Bullets
      ctx.fillStyle = `hsl(${185 - (player.heat * 1.8)}, 100%, 60%)`;
      bullets.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.rad, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Enemies
      ctx.fillStyle = "#f85149";
      enemies.forEach(e => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.rad, 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Player
      ctx.fillStyle = sessionState === "PLAYING" ? `rgb(${90 + player.heat * 1.6}, 110, 240)` : "#484f58";
      ctx.beginPath();
      ctx.arc(player.x, player.y, 14, 0, Math.PI * 2);
      ctx.fill();

      // UI HUD
      ctx.textAlign = "left";
      ctx.fillStyle = "#fff";
      ctx.font = "14px monospace";
      const totalElapsedSeconds = Math.floor(runFrames / 60);
      ctx.fillText(`Time Survived: ${totalElapsedSeconds}s`, 20, 30);
      ctx.fillText(`Heat: ${Math.floor(player.heat)}%`, 20, 50);
      ctx.fillText(`Scrap Carried: ${salvage}`, 20, 70);
      ctx.fillText(`Banked Scrap: ${bankedSalvage}`, 20, 90);

      // Overheat Bar
      ctx.fillStyle = "#21262d";
      ctx.fillRect(20, 102, 160, 10);
      ctx.fillStyle = player.heat > 75 ? "#f85149" : "#388bfd";
      ctx.fillRect(20, 102, 1.6 * player.heat, 10);

      // End-game overlays
      if (sessionState === "EXTRACTED") {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#3fb950";
        ctx.font = "28px monospace";
        ctx.textAlign = "center";
        ctx.fillText("SUCCESSFUL EXTRACTION", canvas.width / 2, 270);
        ctx.font = "16px monospace";
        ctx.fillStyle = "#c9d1d9";
        ctx.fillText(`Salvaged ${salvage} scrap. Bank Total: ${bankedSalvage}`, canvas.width / 2, 310);
        ctx.fillText("Refresh browser to launch next drop.", canvas.width / 2, 350);
      } else if (sessionState === "OVERHEAT") {
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#f85149";
        ctx.font = "28px monospace";
        ctx.textAlign = "center";
        ctx.fillText("REACTOR CORE CRITICAL", canvas.width / 2, 270);
        ctx.font = "16px monospace";
        ctx.fillStyle = "#c9d1d9";
        ctx.fillText("Core incinerated. Unbanked scrap lost.", canvas.width / 2, 310);
        ctx.fillText("Refresh browser to retry.", canvas.width / 2, 350);
      }
    }

    gameLoop();
  </script>
</body>
</html>
